experiment_id: p1-sandbox-5step-langgraph
schema_version: "1.0"

reproducibility:
  seed: 42
  cache_llm_responses: true

agent:
  framework: langgraph
  model: gpt-4o-mini
  goal: "Query weather, search news, summarize in text."
  system_prompt: |
    You must: 1) call get_weather 2) call search_news 3) write a text summary.
    Do NOT call write_summary tool. Stop after text summary.

memory:
  namespace: "exp-p1-5step-langgraph"
  layers:
    - short_term

tools:
  mode: mock

injection:
  mode: none

runner:
  max_steps: 5
  timeout_seconds: 300
  parallel: false
